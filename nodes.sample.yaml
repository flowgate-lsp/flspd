# FLSPD Nodes Configuration
# This file contains the configuration for the LSP nodes.
# It is a YAML list of node configurations.

- # --- Identity & Connection ---
  # Name of the LSP. If empty, the node's alias will be taken instead.
  # The name is returned in the ChannelInformation api endpoint as a friendly name.
  name: "FLSP"

  # The public key of the lightning node. If empty, the node's pubkey will be taken instead.
  # The pubkey is returned in the ChannelInformation api endpoint so clients can connect to the node.
  nodePubkey: "REPLACE_WITH_PUBKEY"

  # Hex encoded private key of the LSP. This is used to decrypt traffic from clients.
  # Note this is not the private key of the node itself, but a separate key for the LSP service.
  # Generate one with `flspd genkey`. Provide it either inline (a plain hex
  # string — don't commit a real one to version control), or by reference so
  # nothing secret ever needs to land in this file:
  #   flspdPrivateKey: {from_env: FLSPD_PRIVATE_KEY}
  #   flspdPrivateKey: {from_file: /run/secrets/flspd_private_key}
  flspdPrivateKey: {from_env: FLSPD_PRIVATE_KEY}

  # Tokens used to authenticate to flspd. These tokens must be unique for each
  # configured node, so it's obvious which node an RPC call is meant for.
  tokens:
    - "REPLACE_WITH_TOKEN"

  # The network location of the lightning node, e.g. `12.34.56.78:9012` or `localhost:10011`.
  host: "127.0.0.1:5521"

  # Configuration for connecting to the LND node.
  flnd:
    # Address to the grpc api.
    address: "flnd:10005"
    
    # Disable TLS verification (useful for testing/internal networks).
    disableTls: false
    
    # TLS certificate for the grpc api. Provide it inline (hex-encoded PEM —
    # don't commit a real one), or by reference: from_file can point
    # directly at flnd's own tls.cert (raw bytes are hex-encoded
    # automatically), or from_env if you'd rather inject it as hex.
    #   cert: {from_file: /root/.flnd/tls.cert}
    #   cert: {from_env: FLND_CERT_HEX}
    cert: {from_file: /root/.flnd/tls.cert}

    # Macaroon to use. Same options as cert above — from_file can point
    # directly at flnd's own *.macaroon file.
    #   macaroon: {from_file: /root/.flnd/data/chain/flokicoin/mainnet/admin.macaroon}
    #   macaroon: {from_env: FLND_MACAROON_HEX}
    macaroon: {from_file: /root/.flnd/data/chain/flokicoin/mainnet/admin.macaroon}

  # --- General Opening Policy ---
  # Public channel amount is a reserved amount for public channels.
  publicChannelAmount: 0

  # Minimum number of confirmations inputs must have for zero-conf channel opens.
  minConfs: 6

  # Minimum timelock delta required for the opened channel.
  timeLockDelta: 400

  # Number of blocks after which an opened channel is considered confirmed.
  targetConf: 6

  # Minimum channel capacity in loki. Must be >= 20000 (LND minimum).
  minChannelCapacityLoki: 20_000

  # Channel capacity in loki added on top of the incoming payment amount when opening a new zero-conf channel.
  additionalChannelCapacity: 21_000

  # Minimum fee in milliloki charged for opening a channel.
  channelMinimumFeeMloki: 1000

  # Fee for opening a zero conf channel per 10000 loki (basis points).
  channelFeePermyriad: 40

  # Duration in seconds used to calculate the MinLifetime block height.
  maxInactiveDuration: 3_888_000

  # The maximum time to hold a htlc after sending a notification when the peer is offline.
  notificationTimeout: "1m"

  # --- JIT (LSPS2) Business Rules ---
  # If true, enables JIT channels to override MinConfs to 0 (implicit zero conf).
  jitEnabled: true
  
  # Minimum payment size in milliloki allowed for JIT channels.
  minPaymentSizeMloki: 1_000

  # Maximum payment size in milliloki allowed for JIT channels.
  jitMaxPaymentSizeMloki: 300_000_000_000

  # Maximum client CLTV delay for JIT channels (optional, default 10000).
  jitMaxClientToSelfDelay: 10_000

  # Validity duration in seconds for the JIT fee parameters (optional, default 86400).
  jitValidUntilSeconds: 86_400

  # Minimum channel balance (Capacity) in Loki for JIT channels (LSPS2).
  jitMinChannelBalanceLoki: 20_000

  # --- Manual Orders (LSPS1) Business Rules ---
  # Minimum required channel confirmations for LSPS1 orders.
  lsps1MinRequiredChannelConfirmations: 0

  # Minimum funding confirms within blocks for LSPS1 orders.
  lsps1MinFundingConfirmsWithinBlocks: 1

  # Supports zero channel reserve for LSPS1 orders.
  lsps1SupportsZeroChannelReserve: true

  # Maximum channel expiry in blocks.
  lsps1MaxChannelExpiryBlocks: 201_600

  # Duration in seconds before an LSPS1 order expires if not funded.
  lsps1OrderExpirySeconds: 86_400

  # Minimum initial client balance in Loki for LSPS1 orders.
  lsps1MinInitialClientBalanceLoki: 0

  # Maximum initial client balance in Loki for LSPS1 orders.
  lsps1MaxInitialClientBalanceLoki: 100_000_000

  # Minimum initial LSP balance in Loki for LSPS1 orders.
  lsps1MinInitialLspBalanceLoki: 1

  # Maximum initial LSP balance in Loki for LSPS1 orders.
  lsps1MaxInitialLspBalanceLoki: 400_000_000

  # Minimum channel balance (Capacity) in Loki for LSPS1 orders.
  lsps1MinChannelBalanceLoki: 20_000

  # Maximum channel balance (Capacity) in Loki for LSPS1 orders.
  lsps1MaxChannelBalanceLoki: 500_000_000

  # --- Routing Policy & Fees ---
  # The fee rate for routing payments (proportional, e.g. 0.000001 = 1ppm).
  feeRate: 0.000001
  
  # The base fee in milliloki for routing payments over the channel.
  baseFeeMloki: 1000
  
  # Smallest HTLC amount in milliloki routed over channels.
  minHtlcMloki: 600
