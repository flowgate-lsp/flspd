name: Release

# A push to main that changes VERSION releases that version: linux binaries,
# a multi-arch image on GHCR, and a GitHub release whose notes come from
# releasenotes/<VERSION>.md (required). A version with a "-" (e.g. v0.1.0-rc.1)
# is a pre-release and does not move the image's `latest` tag.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

# Read-only by default; only the jobs that publish get write scopes.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [ -n "$VERSION" ] || { echo "::error::VERSION is empty"; exit 1; }
          [ -f "releasenotes/${VERSION}.md" ] || { echo "::error::releasenotes/${VERSION}.md is missing"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests (race detector)
        run: go test -race -count=1 $(go list ./... | grep -v '/itest')

  binaries:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          LDFLAGS="-s -w -X github.com/flowgate-lsp/flspd/platform/build.tag=${VERSION} -X github.com/flowgate-lsp/flspd/platform/build.revision=${GITHUB_SHA}"
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o dist/flspd ./cmd/flspd
          go build -trimpath -ldflags "$LDFLAGS" -o dist/flspd_revenue_cli ./cmd/flspd_revenue_cli
          tar -C dist -czf "dist/flspd_linux_${GOARCH}_${VERSION}.tar.gz" flspd flspd_revenue_cli
      - uses: actions/upload-artifact@v4
        with:
          name: flspd_linux_${{ matrix.goarch }}
          path: dist/*.tar.gz

  image:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Only the runtime stage's apk add runs emulated; Go cross-compiles.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            [ "$PRERELEASE" = "true" ] || echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TAG=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # Only the tarballs: build-push-action also uploads a *.dockerbuild
          # record that fails to download and breaks the release.
          pattern: flspd_*
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: releasenotes/${{ needs.prepare.outputs.version }}.md
          files: assets/*.tar.gz
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
